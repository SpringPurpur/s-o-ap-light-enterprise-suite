<div class="app-shell">
  <nav class="nav-rail">
    <div class="nav-brand">
      <span class="nav-brand-mark">?!!</span>
      <span class="nav-brand-text">S(O)AP</span>
    </div>
    <ul class="nav-links">
      @for (item of navItems; track item.path) {
        <li>
          <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.exact }">
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </nav>
  <main class="content">
    <router-outlet />
  </main>
</div>
